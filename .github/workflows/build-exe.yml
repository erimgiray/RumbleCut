# Builds RumbleCut.exe on GitHub's Windows machines on every push to main.
# If __version__ in rumblecut/__init__.py has no release yet, it also publishes
# GitHub Release v<version> with RumbleCut.exe - which is what the app's
# Settings -> "Check for updates" downloads. So: bump the version, push, done.
name: Build RumbleCut.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Get FFmpeg
        shell: pwsh
        run: ./tools/get_ffmpeg.ps1
      - name: Smoke test engine
        run: python -m tests.test_engine
      - name: Build single-file exe
        shell: pwsh
        run: |
          $env:RUMBLECUT_ONEFILE = "1"
          python -m PyInstaller --noconfirm --clean RumbleCut.spec
      - uses: actions/upload-artifact@v4
        with:
          name: RumbleCut-windows
          path: dist/RumbleCut.exe
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import rumblecut; print(rumblecut.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release
        if: steps.ver.outputs.new == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RumbleCut ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/RumbleCut.exe
          generate_release_notes: true
